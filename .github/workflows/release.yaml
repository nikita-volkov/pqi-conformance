name: Release the lib to Hackage

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version in Haskell PVP format (e.g., 1.2.3.4)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version in Haskell PVP format (e.g., 1.2.3.4)"
        required: true
        type: string
    secrets:
      HACKAGE_TOKEN:
        required: true

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PVP version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+(\.[0-9]+)+$'; then
            echo "Error: '${{ inputs.version }}' is not a valid Haskell PVP version (expected e.g. 1.2.3.4)"
            exit 1
          fi

  validate-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate changelog contains Upcoming section
        run: |
          if ! grep -q '^# Upcoming$' CHANGELOG.md; then
            echo "::error::CHANGELOG.md must contain a '# Upcoming' section before releasing."
            exit 1
          fi

      - name: Check changelog release header
        run: |
          expected_heading="# v${{ inputs.version }}"
          top_heading="$(head -n 1 CHANGELOG.md)"

          if [[ "$top_heading" != '# Upcoming' && "$top_heading" != "$expected_heading" ]]; then
            echo "::error::CHANGELOG.md must start with either '# Upcoming' or '$expected_heading' before releasing."
            exit 1
          fi

  build:
    uses: ./.github/workflows/build.yaml
    secrets: inherit

  generate-docs:
    uses: nikita-volkov/haskell-hackage-lib-github-actions-workflows/.github/workflows/generate-docs.yaml@v4
    secrets: inherit

  release:
    needs:
      - validate-version
      - validate-changelog
      - build
      - generate-docs
    runs-on: ubuntu-latest
    environment:
      name: hackage
      url: ${{ steps.generate-hackage-url.outputs.url }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Set package version
        uses: nikita-volkov/edit-cabal-version.github-action@v1
        with:
          mode: set
          set-value: ${{ inputs.version }}

      - name: Promote changelog Upcoming section to release header
        run: |
          set -euo pipefail

          top_heading="$(head -n 1 CHANGELOG.md)"

          if [[ "$top_heading" == '# Upcoming' ]]; then
            perl -0pi -e 's/^# Upcoming$/# v${{ inputs.version }}/m' CHANGELOG.md
          fi

      - name: Extract package name and generate Hackage URL
        id: generate-hackage-url
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name" { gsub(/^[[:space:]]+|[[:space:]]+$/, "", $2); print $2 }' < "$cabal_file")
          echo "url=https://hackage.haskell.org/package/${package_name}-${{ inputs.version }}" >> "${GITHUB_OUTPUT}"

      - name: Generate package dist
        run: cabal sdist

      - name: Generate Haddock
        shell: bash
        # We're doing it in such a complicated way to work around a bug in Cabal,
        # due to which it may generate documentation dist only for the internal libs,
        # if the name of the package is not specified thus:
        # `cabal haddock --haddock-for-hackage $package_name`.
        run: |
          cabal_file=$(find . -maxdepth 1 -name "*.cabal" -print -quit)
          if [ ! -f "$cabal_file" ]; then
            echo "Cabal-file not found"
            exit 1
          fi

          package_name=$(awk -F ":[[:space:]]*" 'tolower($1)=="name"    { print $2 }' < "$cabal_file")
          if [ -z "$package_name" ]; then
            echo "Unable to determine package name"
            exit 1
          fi

          echo "Determined package name: $package_name"

          cabal update
          { file=$(cabal haddock --haddock-for-hackage $package_name | tee /dev/fd/3 | tail -1); } 3>&1
          echo "file=${file}" >> "${GITHUB_OUTPUT}"

      - name: Publish on Hackage
        uses: haskell-actions/hackage-publish@v1.1
        with:
          hackageToken: ${{ secrets.HACKAGE_TOKEN }}
          publish: true
          docsPath: dist-newstyle

      - name: Commit the version update
        id: commit
        # Other workflows (e.g. main-maintenance's format job) can push to
        # master concurrently while this job is busy building/publishing, so
        # a plain push can be rejected as non-fast-forward. Rebase onto the
        # latest master and retry the push a few times before giving up.
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- '*.cabal' CHANGELOG.md; then
            echo "No changes to commit"
            echo "commit_hash=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          git add -- '*.cabal' CHANGELOG.md
          git commit -m "Set package version to ${{ inputs.version }}"

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:master; then
              echo "commit_hash=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}), rebasing onto latest master and retrying..."
            git fetch origin master
            git rebase origin/master
          done

          echo "::error::Failed to push version update after multiple retries"
          exit 1

      - name: Create release tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ github.token }}
          custom_tag: ${{ inputs.version }}
          tag_prefix: v
          commit_sha: ${{ steps.commit.outputs.commit_hash }}
